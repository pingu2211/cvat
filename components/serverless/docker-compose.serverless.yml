services:
  nuclio:
    container_name: nuclio
    image: quay.io/nuclio/dashboard:1.16.3-amd64
    restart: always
    networks:
      - cvat
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      http_proxy:
      https_proxy:
      no_proxy: ${no_proxy:-}
      NUCLIO_CHECK_FUNCTION_CONTAINERS_HEALTHINESS: 'true'
      NUCLIO_DASHBOARD_DEFAULT_FUNCTION_MOUNT_MODE: 'volume'
    logging:
      driver: "json-file"
      options:
        max-size: 100m
        max-file: "3"

  cvat_server:
    environment:
      CVAT_SERVERLESS: 1
      # How long the server waits for a function to answer. Interactors and detectors
      # invoked from the annotation UI are called synchronously, so this is what limits
      # them, and CPU-only models such as SAM3 need several minutes, where the default
      # is two. Keep it in sync with the eventTimeout of the slowest deployed function.
      CVAT_NUCLIO_DEFAULT_TIMEOUT: ${CVAT_NUCLIO_DEFAULT_TIMEOUT:-300}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  cvat_worker_annotation:
    environment:
      CVAT_NUCLIO_DEFAULT_TIMEOUT: ${CVAT_NUCLIO_DEFAULT_TIMEOUT:-300}
    extra_hosts:
      - "host.docker.internal:host-gateway"
