metadata:
  name: pth-facebookresearch-sam3
  namespace: cvat
  annotations:
    name: Segment Anything 3
    version: 2
    type: interactor
    spec:
    min_pos_points: 0
    min_neg_points: 0
    startswith_box_optional: true
    supports_text_prompt: true
    help_message: The interactor allows to get a mask of an object using positive/negative points, a bounding box, and/or a text prompt describing the object

spec:
  description: Interactive, text-promptable object segmentation with SAM3. Requires a Hugging Face
    access token with access to facebook/sam3 (https://huggingface.co/facebook/sam3), supplied via
    the HUGGING_FACE_HUB_TOKEN environment variable at deploy time. Runs on CPU or GPU automatically,
    whichever is available in the container.
  runtime: 'python:3.10'
  handler: main:handler
  eventTimeout: 300s
  env:
    - name: PYTHONPATH
      value: /opt/nuclio/sam3
    - name: HUGGING_FACE_HUB_TOKEN
      value: ''

  build:
    image: cvat.pth.facebookresearch.sam3
    baseImage: ubuntu:22.04

    directives:
      preCopy:
      # disable interactive frontend
        - kind: ENV
          value: DEBIAN_FRONTEND=noninteractive
      # set workdir
        - kind: WORKDIR
          value: /opt/nuclio/sam3
      # install basic deps
        - kind: RUN
          value: apt-get update && apt-get -y install curl git python3 python3-pip python-is-python3 ffmpeg libsm6 libxext6 && rm -rf /var/lib/apt/lists/*
      # install sam3 deps
      # Model weights are NOT baked into the image (facebook/sam3 is a gated model on
      # Hugging Face); they are downloaded at container startup using the token supplied
      # via the HUGGING_FACE_HUB_TOKEN environment variable, so the container needs
      # outbound network access to huggingface.co.
        - kind: RUN
          value: pip3 install torch torchvision --no-cache-dir
        - kind: RUN
          value: pip3 install "transformers>=5.14.0" pillow numpy --no-cache-dir

  triggers:
    myHttpTrigger:
      numWorkers: 2
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 33554432 # 32MB

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
